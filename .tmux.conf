set -g default-terminal "tmux-256color"

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

set-window-option -g mode-keys vi

set -g mouse on

# make v start a charwise selection, to match vim's keybindings
bind -T copy-mode-vi v send -X begin-selection

# Dedent on copy so common indents are ignored. See ~/.local/share/tmux/dedent.awk
DEDENT='$HOME/.local/share/tmux/dedent.awk | tmux load-buffer -w -'
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi C-j   send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "#{DEDENT}"
